<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SplitEasy</title>

    <link rel="stylesheet" href="continue_screen.css">
</head>


<body>

    <div class="app">


        <!-- 
CENTER ILLUSTRATION -->

        <div class="illustration">

            <div class="arc"></div>

            <div class="illustration-icon">

                <div class="paper">

                    <div class="paper-line"></div>
                    <div class="paper-line"></div>
                    <div class="paper-line short"></div>

                </div>

                <div class="green-shape"></div>

                <div class="yellow-shape"></div>

                <div class="blue-shape"></div>

                <div class="small-dot dot-one"></div>
                <div class="small-dot dot-two"></div>
                <div class="small-dot dot-three"></div>

            </div>

        </div>



        <!-- =========================================
             CONTINUE BUTTON
        ========================================== -->

        <button class="continue-btn">
            Continue
        </button>



        <!-- =========================================
             BOTTOM GRADIENT
        ========================================== -->

        <div class="bottom-gradient"></div>



        <!-- =========================================
             BOTTOM NAVIGATION
        ========================================== -->

        <nav class="bottom-nav">


            <!-- HOME -->

            <div class="nav-item">

                <div class="nav-icon home-icon">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

                <div class="nav-label">
                    Home
                </div>

            </div>



            <!-- GROUPS -->

            <div class="nav-item">

                <div class="nav-icon groups-icon">

                    <div class="person"></div>
                    <div class="person small"></div>

                </div>

                <div class="nav-label">
                    Groups
                </div>

            </div>



            <!-- SCAN -->

            <div class="nav-item scan-nav">

                <div class="scan-button">

                    <div class="scan-symbol">
                        ⌗
                    </div>

                </div>

                <div class="nav-label">
                    Scan
                </div>

            </div>



            <!-- BALANCES -->

            <div class="nav-item active">

                <div class="nav-icon balance-icon">

                    <div class="wallet"></div>

                </div>

                <div class="nav-label">
                    Balances
                </div>

            </div>



            <!-- PROFILE -->

            <div class="nav-item">

                <div class="nav-icon profile-icon">

                    <div class="profile-head"></div>

                    <div class="profile-body"></div>

                </div>

                <div class="nav-label">
                    Profile
                </div>

            </div>


        </nav>


    </div>

</body>

</html>
