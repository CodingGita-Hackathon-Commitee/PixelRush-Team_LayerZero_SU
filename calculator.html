<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitEasy Smart Calculator</title>

    <link rel="stylesheet" href="calculator.css">
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-header">

        <button class="circle-btn back-btn">←</button>

        <h1>09 Inbuilt Smart Calculator</h1>

        <button class="profile-btn">♙</button>

    </header>


    <!-- =========================
         PAGE HEADING
    ========================== -->

    <section class="page-heading">

        <h2>
            Split Calculator 🧮
        </h2>

        <span class="trip-badge">
            <i></i>
            GOA SUNSETS '26
        </span>

    </section>


    <!-- =========================
         BILL SUMMARY
    ========================== -->

    <section class="bill-card">

        <div class="bill-formula">
            <span class="receipt-icon">▣</span>

            <p>
                Total ($110.00) + Tip 15% ($16.50) +
                Tax ($7.50) - Coupon ($10.00)
            </p>
        </div>


        <h2 class="total-amount">
            ₹124.00
        </h2>


        <!-- Person Share -->

        <div class="person-share">

            <p>EACH PERSON PAYS</p>

            <strong>₹31.00</strong>

            <div class="share-bottom">

                <div class="avatars">
                    <span>👨‍👩‍👧</span>
                    <span>👩</span>
                    <span>👨</span>
                    <span>🏙️</span>
                </div>


                <div class="people-control">

                    <button>−</button>

                    <span>
                        ♧ <b>4</b>
                    </span>

                    <button>+</button>

                </div>

            </div>

        </div>

    </section>


    <!-- =========================
         TIP OPTIONS
    ========================== -->

    <section class="options-section">

        <div class="tip-row">

            <span class="option-title">TIP:</span>

            <button class="chip">0%</button>
            <button class="chip">10%</button>
            <button class="chip active-green">15%</button>
            <button class="chip">✎ Custom</button>

        </div>


        <!-- Split Type -->

        <div class="split-types">

            <button class="split-chip selected">
                Equally
            </button>

            <button class="split-chip">
                Custom Items
            </button>

            <button class="split-chip">
                ↟ Round Up
            </button>

        </div>


        <!-- Voucher -->

        <div class="voucher">

            <div class="voucher-left">
                <span>🎟</span>
                <strong>Squad Voucher Available</strong>
            </div>

            <div class="voucher-right">
                <b>−₹10.00 Off</b>
                <span>✓</span>
            </div>

        </div>

    </section>


    <!-- =========================
         CALCULATOR
    ========================== -->

    <section class="calculator">

        <div class="calculator-grid">

            <!-- Row 1 -->

            <button class="calc-btn clear">C</button>
            <button class="calc-btn">( )</button>
            <button class="calc-btn">%</button>
            <button class="calc-btn operator">÷</button>


            <!-- Row 2 -->

            <button class="calc-btn">7</button>
            <button class="calc-btn">8</button>
            <button class="calc-btn">9</button>
            <button class="calc-btn operator">×</button>


            <!-- Row 3 -->

            <button class="calc-btn">4</button>
            <button class="calc-btn">5</button>
            <button class="calc-btn">6</button>
            <button class="calc-btn operator">−</button>


            <!-- Row 4 -->

            <button class="calc-btn">1</button>
            <button class="calc-btn">2</button>
            <button class="calc-btn">3</button>
            <button class="calc-btn operator">+</button>


            <!-- Row 5 -->

            <button class="calc-btn">0</button>
            <button class="calc-btn">.</button>
            <button class="calc-btn">⌫</button>
            <button class="calc-btn equals">=</button>

        </div>

    </section>


    <!-- =========================
         ACTION BUTTONS
    ========================== -->

    <section class="bottom-actions">

        <button class="add-expense-btn">
            <span>
                Add to Goa Trip as Expense
            </span>

            <strong>
                ($124.00)
            </strong>

            <small>🚀</small>
        </button>


        <button class="copy-btn">
            ▣ &nbsp; Copy Individual Amounts ($31.00)
        </button>

    </section>

</div>

</body>
</html>
