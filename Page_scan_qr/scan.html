<!-- FRAME 1: scan-pay.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan To Pay</title>
  <link rel="stylesheet" href="scan.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <button class="circle">←</button>
    <h1>10 Scan To Pay Qr View</h1>
    <button class="profile">◉</button>
  </header>

  <main>

    <section class="toolbar">
      <div class="tabs">
        <button class="active">▣ Scan Pay</button>
        <button>⌗ My Squad QR</button>
      </div>

      <div class="icons">
        <button>ϟ</button>
        <button>⤢</button>
      </div>
    </section>

    <section class="scanner">
      <img src="https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=900&q=80" alt="receipt">
      <div class="overlay"></div>
      <div class="qr-box"></div>
      <div class="center-dot"></div>

      <div class="person-card">
        <img src="https://i.pravatar.cc/90?img=47" alt="Maya">
        <div class="person-info">
          <h2>Maya Lin <span>SQUAD</span></h2>
          <p>@maya_splits • Beach Snacks & Ride</p>
        </div>
        <div class="amount">
          <strong>₹80.00</strong>
          <span>Matched</span>
        </div>
      </div>

      <div class="hint">● ALIGN QR CODE WITHIN BOUNDS</div>
    </section>

    <section class="pay-card">
      <div class="notice">🛡 Zero fee instant settlement • Direct Bank & Peer Ready</div>

      <button class="pay-btn">Pay ₹80.00 & Settle with Maya <span>ϟ</span></button>

      <div class="action-row">
        <button>▣ Upload QR Photo</button>
        <button>⠿ Enter Tag Manually</button>
      </div>

      <div class="rail-head">
        <span>SETTLEMENT RAIL</span>
        <b>DEFAULT: SPLIT WALLET</b>
      </div>

      <div class="grid">
        <button class="dark">▣ Wallet ($142)</button>
        <button>▣ Cash App</button>
        <button>⌂ Direct Bank</button>
        <button class="dark">▣ Scan QR</button>
        <button>▣ Calculator</button>
        <button>⌂ AI Chat</button>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">
    <a href="#"><span>⊞</span>Home</a>
    <a href="#"><span>♧</span>Groups</a>
    <a href="#" class="scan">▦</a>
    <a href="#" class="active"><span>▣</span>Balances</a>
    <a href="#"><span>◉</span>Profile</a>
  </nav>

</div>

</body>
</html>
